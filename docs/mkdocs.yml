# cl-cc-ast documentation — MkDocs + Material configuration.
#
# Build:   mkdocs build -f docs/mkdocs.yml --strict
# Serve:   mkdocs serve  -f docs/mkdocs.yml
# `nix build .#docs` drives this same config offline, and checks.docs runs it
# on every `nix flake check`, so a broken link or an unlisted page fails the
# pull request rather than the post-merge deploy.

site_name: cl-cc-ast
site_description: cl-cc AST node types and protocol (ast-children, ast-bound-names)
site_url: https://nerima-lisp.github.io/cl-cc-ast/
repo_url: https://github.com/nerima-lisp/cl-cc-ast
repo_name: nerima-lisp/cl-cc-ast
edit_uri: edit/main/docs/src/

docs_dir: src

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

# Every page under docs/src/ must appear here: --strict fails the build on an
# unlisted page. That is deliberate, so the nav cannot silently fall behind.
#
# The org template also lists Reference/Compatibility and Project/Roadmap and
# Project/Releasing. They are omitted rather than stubbed: this system is
# pre-1.0 with no compatibility promise to make yet, and an empty roadmap page
# is worse than no roadmap page.
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guide:
      - Core concepts: guide/concepts.md
      - Recipes: guide/recipes.md
  - Reference:
      - API: reference/api.md
      - Architecture: reference/architecture.md
  - Project:
      - Versioning: project/versioning.md
