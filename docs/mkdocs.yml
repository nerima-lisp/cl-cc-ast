# Build:   mkdocs build -f docs/mkdocs.yml --strict
# Serve:   mkdocs serve  -f docs/mkdocs.yml
# `nix flake check` runs the strict build in pull request CI. The
# `.github/workflows/docs.yml` workflow publishes Pages after a push to main,
# so broken links and missing navigation entries fail before publication.

site_name: cl-cc-ast
site_description: cl-cc AST nodes, tree operations, and closure analysis
site_url: https://nerima-lisp.github.io/cl-cc-ast/
repo_url: https://github.com/nerima-lisp/cl-cc-ast
repo_name: nerima-lisp/cl-cc-ast
edit_uri: edit/main/docs/src/

docs_dir: src

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

# Every page under docs/src/ must appear here: --strict fails the build on an
# unlisted page.
#
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guide:
      - Core concepts: guide/concepts.md
      - Recipes: guide/recipes.md
  - Reference:
      - API: reference/api.md
      - Architecture: reference/architecture.md
      - Glossary: reference/glossary.md
  - Project:
      - Versioning: project/versioning.md
